[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchforge"
version = "0.1.0"
description = "Computational Research Lifecycle Engine — Local-first, reproducible, provenance-tracked research orchestration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Radaikalam Lab", email = "info@radaikalam.org"}
]
keywords = [
    "computational-research",
    "scientific-computing",
    "reproducibility",
    "provenance",
    "epistemic-engineering",
    "falsification",
    "research-lifecycle"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
scientific = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "networkx>=3.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
researchforge = "researchforge.cli.main:app"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["researchforge*"]

[tool.setuptools.package-data]
researchforge = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q -W error"
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
mypy_path = "backend"
